<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Will you be my date?</title>
    <style>
        :root {
            --bg1: #ffd1dc;
            --bg2: #ff9eb5;
            --accent: #e63977;
            --text: #4a1a2c;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
            overflow: hidden;
            text-align: center;
        }
        .card {
            background: rgba(255,255,255,0.85);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            max-width: 420px;
            width: calc(100% - 32px);
            position: relative;
            z-index: 2;
        }
        .emoji { font-size: 72px; margin-bottom: 8px; animation: beat 1.2s infinite; }
        @keyframes beat { 0%,100% { transform: scale(1);} 50% { transform: scale(1.15);} }
        h1 { margin: 0 0 24px; font-size: 28px; }
        .buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            min-height: 80px;
        }
        button {
            border: none;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            padding: 14px 32px;
            transition: transform 0.15s ease;
        }
        button:hover { transform: scale(1.06); }
        #yes { background: var(--accent); color: #fff; }
        #no  { background: #fff; color: var(--accent); border: 2px solid var(--accent); }
        #message { font-size: 20px; margin-top: 20px; min-height: 28px; font-weight: 600; }
        .hidden { display: none !important; }
        .heart {
            position: fixed;
            top: -40px;
            font-size: 24px;
            animation: fall linear forwards;
            z-index: 1;
            pointer-events: none;
        }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0.8; } }

        /* ===== Intro screen ===== */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            cursor: pointer;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }
        #intro.leaving { opacity: 0; transform: scale(1.15); pointer-events: none; }
        .envelope { font-size: 110px; animation: wiggle 1.4s ease-in-out infinite; }
        @keyframes wiggle {
            0%,100% { transform: rotate(-6deg) scale(1); }
            50% { transform: rotate(6deg) scale(1.1); }
        }
        #intro h2 { margin: 12px 0 6px; font-size: 26px; }
        #intro p { margin: 0; opacity: 0.8; animation: pulse 1.6s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

        /* ===== Love letter ===== */
        #letter {
            margin-top: 20px;
            padding: 22px 20px;
            background: #fffaf0;
            border: 1px solid #f0d9b5;
            border-radius: 6px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            font-family: "Georgia", "Times New Roman", serif;
            text-align: left;
            line-height: 1.6;
            max-height: 42vh;
            overflow-y: auto;
            white-space: pre-wrap;
            transform-origin: bottom center;
            animation: letterRise 1s ease-out both;
        }
        @keyframes letterRise {
            from { opacity: 0; transform: translateY(60px) scale(0.6) rotate(-4deg); }
            to   { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }
        #letter .sign { display: block; margin-top: 14px; text-align: right; font-style: italic; color: var(--accent); }
        .cursor::after { content: "|"; animation: blink 0.8s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

<!-- Intro: tap to open -->
<div id="intro">
    <div class="envelope">💌</div>
    <h2>You have a message for you</h2>
    <p>Tap to open</p>
</div>

<div class="card hidden" id="card">
    <div class="emoji" id="emoji">💌</div>
    <h1 id="title">Will you be my date?</h1>
    <div class="buttons" id="buttons">
        <button id="yes">Yes 💖</button>
        <button id="no">No 💔</button>
    </div>
    <div id="message"></div>
    <div id="letter" class="hidden"></div>
</div>

<!-- Music file: must be in the same folder as this index.html -->
<audio id="music" src="akoangbagyo.mp3" preload="auto"></audio>

<script>
    // ====== MUSIC SETTINGS ======
    const CHORUS_START = 1;    // seconds where the chorus begins (change this!)
    const CHORUS_END = 75;      // seconds where the chorus ends (change this!)
    const NO_CLICKS_NEEDED = 3; // music starts on this many "No" clicks
    // ============================

    const music = document.getElementById('music');

    // Stop automatically when the chorus ends
    music.addEventListener('timeupdate', () => {
        if (music.currentTime >= CHORUS_END) music.pause();
    });

    // "Unlock" audio during the first tap (needed on phones/browsers)
    function unlockAudio() {
        music.muted = true;
        const p = music.play();
        if (p && p.then) {
            p.then(() => { music.pause(); music.muted = false; }).catch(() => { music.muted = false; });
        }
    }

    function playChorus() {
        music.muted = false;
        music.volume = 1;
        music.currentTime = CHORUS_START;
        music.play().catch(() => {
            message.textContent = "Can't find akoangbagyo.mp3 🎵 (check it's in the same folder)";
        });
    }

    function stopMusic() {
        music.pause();
        music.currentTime = 0;
    }
</script>

<script>
    const intro = document.getElementById('intro');
    const card = document.getElementById('card');
    const yes = document.getElementById('yes');
    const no = document.getElementById('no');
    const title = document.getElementById('title');
    const emoji = document.getElementById('emoji');
    const message = document.getElementById('message');
    const buttons = document.getElementById('buttons');

    let noCount = 0;
    let yesScale = 1;

    const noMessages = [
        "Are you sure? 🥺",
        "Pag-isipan mo ulit... 😢",
        "Please? 🥹",
        "Last chance! 😭",
        "Sige na, pls! 💔"
    ];

    // Open the envelope
    intro.addEventListener('click', () => {
        unlockAudio();
        intro.classList.add('leaving');
        card.classList.remove('hidden');
        setTimeout(() => intro.remove(), 650);
    });

    // Make the "No" button jump to a random spot on the screen
    function moveNo() {
        const pad = 12;
        const maxX = window.innerWidth - no.offsetWidth - pad;
        const maxY = window.innerHeight - no.offsetHeight - pad;
        no.style.position = 'fixed';
        no.style.left = Math.max(pad, Math.random() * maxX) + 'px';
        no.style.top = Math.max(pad, Math.random() * maxY) + 'px';
        no.style.zIndex = 5;
    }

    // After 3 "No" clicks it also runs away when he tries to touch it
    ['mouseover', 'touchstart'].forEach(evt => {
        no.addEventListener(evt, (e) => {
            if (noCount >= NO_CLICKS_NEEDED) {
                e.preventDefault();
                moveNo();
            }
        }, { passive: false });
    });

    no.addEventListener('click', () => {
        noCount++;
        moveNo(); // jumps somewhere new every time it's clicked

        // Music only starts once "No" has been clicked 3 times
        if (noCount >= NO_CLICKS_NEEDED) playChorus();

        // Make the "Yes" button bigger and the "No" button smaller each time
        yesScale += 0.25;
        yes.style.transform = `scale(${yesScale})`;
        yes.style.margin = `${yesScale * 6}px`;
        no.style.fontSize = Math.max(10, 18 - noCount) + "px";

        emoji.textContent = "🌀";
        message.textContent = noMessages[Math.min(noCount - 1, noMessages.length - 1)];
    });

    yes.addEventListener('click', () => {
        stopMusic();
        title.textContent = "Yay!! See you on our date! 🥰";
        emoji.textContent = "💕";
        buttons.classList.add('hidden');
        message.textContent = "You just made my day 💖";
        for (let i = 0; i < 40; i++) setTimeout(spawnHeart, i * 80);
        setInterval(spawnHeart, 300);
        setTimeout(showLetter, 1800); // the letter appears after a short pause
    });

    // ====== WRITE YOUR LOVE LETTER HERE ======
    const LETTER_TO   = "Dear Papi Ingrid,";
    const LETTER_BODY = "This Letter may fuck up with you\n\nBut I want to say that your a fucking bullshit\nand yung lang tangina mo ka";
    const LETTER_FROM = "Papi Reily💖";
    const TYPING_SPEED = 45; // milliseconds per letter (lower = faster)
    // =========================================

    // Letter rises up, then is "typed" out letter by letter
    function showLetter() {
        const letter = document.getElementById('letter');
        letter.classList.remove('hidden');
        letter.classList.add('cursor');
        const fullText = LETTER_TO + "\n\n" + LETTER_BODY;
        letter.textContent = "";
        let i = 0;
        const timer = setInterval(() => {
            letter.textContent = fullText.slice(0, ++i);
            letter.scrollTop = letter.scrollHeight;
            if (i >= fullText.length) {
                clearInterval(timer);
                letter.classList.remove('cursor');
                const sign = document.createElement('span');
                sign.className = 'sign';
                sign.textContent = LETTER_FROM;
                letter.appendChild(sign);
                letter.scrollTop = letter.scrollHeight;
            }
        }, TYPING_SPEED);
    }

    function spawnHeart() {
        const h = document.createElement('div');
        h.className = 'heart';
        h.textContent = ['💖','💕','💗','❤️','🌸'][Math.floor(Math.random() * 5)];
        h.style.left = Math.random() * 100 + 'vw';
        h.style.animationDuration = (3 + Math.random() * 3) + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 6500);
    }
</script>
</body>
</html>
